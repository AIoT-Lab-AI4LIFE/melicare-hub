<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Đăng nhập · MELI Voice</title>
<script src="/config.js"></script><script src="assets/melivoice-auth.js"></script>
<link rel="stylesheet" href="assets/melicare-fonts-local.css"/>
<link rel="icon" href="assets/icons/favicon.ico" sizes="any"/>
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml"/>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px 16px;background:#f5f8fc;color:#17344a;font:15px/1.5 'Nunito Sans',Segoe UI,Arial,sans-serif}
.card{width:100%;max-width:430px;padding:24px 22px;text-align:center;background:#fff;border:1px solid #dbe6ee;border-radius:20px;box-shadow:0 30px 80px rgba(20,52,86,.22)}
.mark{width:42px;height:42px;margin:0 auto;display:grid;place-items:center;padding:9px;border:1px solid #dbd4f0;border-radius:13px;background:#f1edfb;color:#7062b1}
.mark svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1{margin:12px 0 0;font:700 22px/1.3 Poppins,'Plus Jakarta Sans',sans-serif;color:#173b66}
h1 em{font-style:normal;font-weight:500;color:#7062b1}
.note{margin:6px 0 0;color:#7b8ea0}
.error{margin:16px 0 0;padding:9px 10px;border:1px solid #f0d0d3;border-radius:8px;background:#fff1f1;color:#a34e55;font-size:14px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:45px;margin-top:20px;border:1px solid #d4e0eb;border-radius:10px;background:#fff;color:#36596f;font:inherit;font-weight:800;text-decoration:none;cursor:pointer}
.btn+.btn{margin-top:10px}
.btn.primary{background:linear-gradient(135deg,#102a56,#1d609d);border-color:#102a56;color:#fff}
.btn:focus-visible{outline:3px solid #55b4dd;outline-offset:3px}
[hidden]{display:none!important}
</style></head>
<body>
<main class="card">
  <span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><rect height="11" rx="4" width="8" x="8" y="3"></rect><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v3M8 21h8"></path></svg></span>
  <h1>Đăng nhập MELI<em>Voice</em></h1>
  <p class="error" id="error" role="alert" hidden>Liên kết đăng nhập không hợp lệ hoặc đã hết hạn. Vui lòng đăng nhập lại.</p>
  <p class="note" id="note" aria-live="polite">Đang chuyển đến trang đăng nhập MELICARE…</p>
  <a class="btn" id="portal" href="#">Đăng nhập qua MELICARE</a>
  <button class="btn" id="dev" type="button" hidden>Đăng nhập giả (dev)</button>
</main>
<script>
/* Tới đây khi chưa có token dùng được: chuyển sang portal MELICARE, portal quay lại /login?token=...
   Token bị từ chối thì dừng ở đây (không tự chuyển) để portal cấp token sai không gây vòng lặp. */
(function () {
  var A = window.MELIVOICE_AUTH, params = new URLSearchParams(location.search);
  if (A.REDIRECTING) return;
  var to = A.safeRedirect(params.get('redirect'));
  var rejected = params.get('error') === 'token';
  var portal = A.portalLoginUrl(to);
  var link = document.getElementById('portal');
  link.href = portal;
  if (rejected) {
    document.getElementById('error').hidden = false;
    document.getElementById('note').hidden = true;
    link.textContent = 'Đăng nhập lại qua MELICARE';
  }
  if (rejected || A.DEV_LOGIN) link.classList.add('primary');
  if (A.DEV_LOGIN) {
    if (!rejected) document.getElementById('note').textContent = 'Chế độ dev (DEV_LOGIN): chọn cách đăng nhập.';
    var dev = document.getElementById('dev');
    dev.hidden = false;
    dev.addEventListener('click', function () { A.devSignIn(); location.replace(to); });
  } else if (!rejected) {
    location.replace(portal);
  }
})();
</script>
</body></html>
