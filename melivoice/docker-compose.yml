services:
  meli-voice:
    build: .
    image: meli-voice:latest
    container_name: meli-voice
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      MELIDATA_URL: ${MELIDATA_URL:-http://melidata-api-1:3200}
      MELIDATA_TENANT_ID: ${MELIDATA_TENANT_ID:-development}
      CACHE_AUDIO_MAX_MB: ${CACHE_AUDIO_MAX_MB:-512}
      CACHE_MAX_RECORDS: ${CACHE_MAX_RECORDS:-1000}
    networks:
      - default
      - melidata
    volumes:
      - ./data:/data
    ports:
      - "${PORT:-8765}:8765"   # cổng duy nhất mở ra ngoài (UI + API)
networks:
  melidata:
    external: true
    name: melidata_default
