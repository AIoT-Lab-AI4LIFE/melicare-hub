<title id="mc11-vlm-title">MELIVLM — từ ảnh y tế đến hỏi đáp và báo cáo</title><desc id="mc11-vlm-desc">Bác sỹ đặt câu hỏi về một vùng trên ảnh X-quang. AI hỗ trợ phân tích ảnh và tạo báo cáo nháp để bác sỹ kiểm duyệt.</desc>
