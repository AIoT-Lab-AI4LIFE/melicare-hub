server {
    server_name melicare.meliq.ai;
    root /home/ubuntu/projects/melicare;

    access_log /var/log/nginx/melicare_access.log;
    error_log  /var/log/nginx/melicare_error.log;

    charset utf-8;

    # Revalidate on every load (cheap 304 via ETag) so a deploy, e.g. a URL change in
    # assets/melicare-routes.js, takes effect immediately instead of serving a cached copy.
    add_header Cache-Control "no-cache" always;

    # Never serve the git checkout, dotfiles or repo-only files (docs, scripts, archives, this config).
    location ~ /\.(?!well-known/) {
        deny all;
    }
    location ~* \.(md|txt|py|zip|conf)$ {
        deny all;
    }
    # MeliVoice app source (backend + UI) lives in the repo but is deployed separately (melivoice.meliq.ai).
    location ^~ /melivoice/ {
        return 404;
    }

    # Trang chính
    location = / {
        try_files /MELICARE.html =404;
    }

    # Các trang con — hỗ trợ cả /about.html và /about
    location / {
        try_files $uri $uri.html =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/melicare.meliq.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/melicare.meliq.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = melicare.meliq.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name melicare.meliq.ai;
    listen 80;
    return 404; # managed by Certbot
}
