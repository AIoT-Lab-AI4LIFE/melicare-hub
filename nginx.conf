server {
    listen 80;
    listen [::]:80;
    server_name melicare.leira.com.vn;

    root /home/ubuntu/projects/melicare;
    index MELICARE.html;

    charset utf-8;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/auth/ {
        proxy_pass https://medibot.leira.com.vn/api/auth/;
        proxy_ssl_server_name on;
        proxy_set_header Host medibot.leira.com.vn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Revalidate pages and assets on every load so URL changes in assets/melicare-routes.js take effect immediately.
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache";
    }

    location ~ /\. {
        deny all;
    }
}
