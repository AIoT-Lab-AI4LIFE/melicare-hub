<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="mc-ai-scene mc-h16" viewBox="0 0 720 500" role="img" aria-labelledby="mc-h16-title mc-h16-desc">
<title id="mc-h16-title">AI và tri thức chuyên gia phục vụ vận hành và khám chữa bệnh</title>
<desc id="mc-h16-desc">Sách và hướng dẫn chuyên môn cung cấp tri thức cho AI ở trung tâm. AI kết nối với bệnh viện và bảng điều phối ở bên trái, cùng giường bệnh, hồ sơ khám và màn hình theo dõi ở bên phải, hỗ trợ tối ưu nguồn lực, hỗ trợ bác sỹ và chăm sóc người bệnh.</desc>
<style>
.mc-h16 text{font-family:"Nunito Sans",Arial,sans-serif}
.mc-h16-title{font-size:20px;font-weight:750;fill:#244e67}
.mc-h16-note{font-size:14px;font-weight:600;fill:#7793a5}
.mc-h16-ink{stroke:#356b89;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mc-h16-detail{stroke:#8bbbd7;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.mc-h16-flow{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7}
.mc-h16-flow-accent{stroke-dasharray:8 75;animation:mcH16Flow 6s linear infinite}
.mc-h16-schedule{animation:mcH16Schedule 7s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.mc-h16-vitals{stroke-dasharray:100;animation:mcH16Vitals 7s ease-in-out infinite}
.mc-h16-synapse{animation:mcH16Synapse 4s ease-in-out infinite;animation-delay:var(--delay,0s)}
.mc-h16-verified{animation:mcH16Verified 7s ease-in-out infinite}
@keyframes mcH16Flow{to{stroke-dashoffset:-166}}
@keyframes mcH16Schedule{0%,15%,100%{transform:scaleX(.6)}40%,80%{transform:scaleX(1)}}
@keyframes mcH16Vitals{0%,10%{stroke-dashoffset:100}65%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-100}}
@keyframes mcH16Synapse{0%,100%{opacity:.45}40%,70%{opacity:1}}
@keyframes mcH16Verified{0%,100%{opacity:.65}35%,80%{opacity:1}}
@media(prefers-reduced-motion:reduce){.mc-h16 *{animation:none!important}.mc-h16-packets{display:none}.mc-h16-vitals{stroke-dashoffset:0}}
@media print{.mc-h16 *{animation:none!important}.mc-h16-packets{display:none}.mc-h16-vitals{stroke-dashoffset:0}}
</style>
<defs>
<linearGradient id="mc-h16-ai" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#129cf4"/><stop offset="1" stop-color="#0780d3"/></linearGradient>
