<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="mc-care-art mc-care-art-refined" viewBox="0 0 520 320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mc11-dx-title mc11-dx-desc">
<title id="mc11-dx-title">MELIDx — dữ liệu lâm sàng, AI theo nhóm bệnh, hỗ trợ diagnosis</title><desc id="mc11-dx-desc">Medical images, tín hiệu và các chỉ số patients bệnh đi vào công cụ AI theo nhóm bệnh, hỗ trợ phân tích tim mạch, thần kinh và metabolism.</desc>
<defs>
 <linearGradient id="mc11-dx-blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#30a8fb"/><stop offset="1" stop-color="#087bda"/></linearGradient>
 <linearGradient id="mc11-dx-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#078cf0" stop-opacity=".18"/><stop offset="1" stop-color="#078cf0" stop-opacity="0"/></linearGradient>
 <filter id="mc11-dx-shadow" x="-35%" y="-35%" width="180%" height="185%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="6"/><feColorMatrix type="matrix" values="0 0 0 0 .03 0 0 0 0 .4 0 0 0 0 .7 0 0 0 .10 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
