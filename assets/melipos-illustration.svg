<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="mc-care-art mc-care-art-refined" viewBox="0 0 520 320" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="mc11-pos-title mc11-pos-desc">
<title id="mc11-pos-title">MELIPos — diễn biến sau mổ, nhận diện nguy cơ, ưu tiên theo dõi</title><desc id="mc11-pos-desc">Đường diễn biến chỉ số sau mổ vượt vùng cần chú ý. Điểm này được liên kết trực tiếp tới cảnh báo nguy cơ biến chứng và ưu tiên theo dõi người bệnh.</desc>
<defs>
