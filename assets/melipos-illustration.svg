 <linearGradient id="mc11-pos-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#078cf0" stop-opacity=".18"/><stop offset="1" stop-color="#078cf0" stop-opacity="0"/></linearGradient>
 <filter id="mc11-pos-shadow" x="-35%" y="-35%" width="180%" height="185%"><feGaussianBlur in="SourceAlpha" stdDeviation="4"/><feOffset dy="6"/><feColorMatrix type="matrix" values="0 0 0 0 .03 0 0 0 0 .4 0 0 0 0 .7 0 0 0 .10 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
